# Build and publish public-site/ to GitHub Pages.
#
# ⛔ DELIBERATELY MANUAL. The trigger is `workflow_dispatch` ONLY, so this never
#    fires on a push and nothing reaches the public web until a human runs it
#    from the Actions tab. Publishing is an owner act (public-docs chain rule 5).
#
#    To make it automatic later, uncomment the `push` block below. Do that only
#    after the site's content is real — the pages in public-site/content/ are
#    currently LAYOUT SPECIMENS and say so on their face.
#
# ⛔ BEFORE THE FIRST RUN, the owner must enable Pages:
#      repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#    Without that, the deploy step fails with a permissions error. Nothing else
#    is needed; there is no cost for a public repo.
#
# ⛔⛔ EXPOSURE GATE. This workflow builds `public-site/mkdocs.yml`, whose
#     `docs_dir` is `content`. The repo's `docs/` folder is never an input and
#     must never become one — it holds the agent corpus and the owner's playtest
#     checklist. The verify step below FAILS THE BUILD if the config is ever
#     pointed somewhere else.

name: Publish docs site

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['public-site/**', '.github/workflows/publish-site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exposure gate — the build may only read public-site/content
        run: |
          set -e
          grep -qx 'docs_dir: content' public-site/mkdocs.yml \
            || { echo "REFUSING: public-site/mkdocs.yml no longer declares 'docs_dir: content'."; exit 1; }
          if grep -rn -- '\.\./' public-site/mkdocs.yml public-site/content; then
            echo "REFUSING: a path escapes public-site/ — the site must not read the repo's docs/."
            exit 1
          fi
          echo "exposure gate OK: build input is public-site/content only"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python -m pip install --upgrade mkdocs-material

      - run: python -m mkdocs build --strict -f public-site/mkdocs.yml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
